<!DOCTYPE html>

<html lang="en">

<head>
    <title>Madspild</title>
    <link rel="stylesheet" href="VHD-style.css">
</head>

<body>
    <a href="../index.html">
        <img class="logo" src="Logo.png" alt="MadRedder logo">
    </a>

    <h1> Virksomhedsportal </h1>
    <h2> Opret din virksomhed </h2>

    <form class="form">
        <Label for="cvr">CVR.nr: </Label>
        <input type="text" id="cvr" required>

        <br>

        <Label for="email">E-mail: </Label>
        <input type="email" id="email" required>

        <br>

        <Label for="password">Adgangskode: </Label>
        <input type="password" id="password" required>

        <br>

        <Label for="repeat password"> Gentag adgangskode: </Label>
        <input type="repeat password" id="repeat password" required>

        <br>

        <button type="submit">Opret profil</button>
    </form>


    <p>
        Har du allerede en profil?
        <a href="3.VHD-Login.html" > Log ind</a>
    </p>



</body>

</html>
