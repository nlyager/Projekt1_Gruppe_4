<!DOCTYPE html>

<html lang="en">

<head>
    <title>Madspild</title>
    <link rel="stylesheet" href="FB-style.css">
</head>

<body>
    <img class="logo" src="Logo.png" alt="MadRedder logo">

    <h1> Forbruger Portal </h1>
    <h2> Opret dig </h2>

    <form class="form">

        <Label for="email">E-mail: </Label>
        <input type="email" id="email" required>

        <br>

        <Label for="phonenumber">Tlf.nr: </Label>
        <input type="text" id="phonenumber" required>

        <br>

        <Label for="password">Adgangskode: </Label>
        <input type="password" id="password" required>

        <br>

        <Label for="repeat password"> Gentag adgangskode: </Label>
        <input type="repeat password" id="repeat password" required>

        <br>

        <button type="submit">Opret profil</button>
    </form>


    <p>
        Har du allerede en profil?
        <a href="3.FB-Login.html" > Log ind</a>
    </p>

</body>

</html>
