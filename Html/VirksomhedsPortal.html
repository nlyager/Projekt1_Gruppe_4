<body>
<div id="header-container">
  <header>
    <div id="header-left">
      <a id="header-logo" href="../index.html">
        <img src="../Images/madredder-logo.svg">
      </a>
      <a class="header-link" href="../Html/Shop/PoseOversigt.html">Madspilds Tilbud</a>

    <div id="header-right">
    </div>
  </header>

<h1>Velkommen til virksomhedsportalen</h1>

<h2>Sæt en madpose til salg</h2>

<form class="form" action="../404.html">

  <label for="navn">Navn på madpose:</label>
  <input
          type="text"
          id="navn"
          placeholder="F.eks. Bagerpose"
          required
  >

  <label for="beskrivelse">Beskrivelse:</label>
  <textarea
          id="beskrivelse"
          placeholder="Beskriv hvad posen kan indeholde..."
          required
  ></textarea>

  <label for="pris">Pris:</label>
  <input
          type="number"
          id="pris"
          placeholder="F.eks. 49"
          required
  >

  <label for="antal">Antal poser:</label>
  <input
          type="number"
          id="antal"
          placeholder="F.eks. 10"
          required
  >

  <label for="adresse">Adressen for afhentning:</label>
  <input
          type="text"
          id="adresse"
          placeholder="F.eks. Karmstensvej 2A, 3650 Ølstykke"
          required
  >

  <button type="submit">Sæt pose til salg</button>

</form>


<p>
  Når du sætter en pose til salg, hjælper du med at reducere madspild.
</p>

</body>
